name: Hot Wheels Stock Checker

on:
  workflow_dispatch:
  schedule:
    # हर 30 मिनट में check
    - cron: "*/30 * * * *"

permissions:
  actions: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Check Hot Wheels product
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_ID: "787950"
          PINCODE: "226004"
          PRODUCT_URL: "https://blinkit.com/prn/x/prid/787950"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          import subprocess
          import sys

          PARSE_API_KEY = os.environ["PARSE_API_KEY"]
          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          PRODUCT_ID = os.environ["PRODUCT_ID"]
          PINCODE = os.environ["PINCODE"]
          PRODUCT_URL = os.environ["PRODUCT_URL"]

          REPO = os.environ["GH_REPO"]

          BASE = (
              "https://api.parse.bot/scraper/"
              "99ee22ab-c3b4-4c1b-b96d-b828aac93698"
          )

          headers = {
              "X-API-Key": PARSE_API_KEY,
              "Content-Type": "application/json",
              "User-Agent": "HotWheelsStockAlert/1.0"
          }

          def api_request(url, params=None):
              if params:
                  url += "?" + urllib.parse.urlencode(params)

              req = urllib.request.Request(
                  url,
                  headers=headers,
                  method="GET"
              )

              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode())

          def post_api(url, payload):
              req = urllib.request.Request(
                  url,
                  headers=headers,
                  data=json.dumps(payload).encode(),
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode())

          def telegram(message):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              payload = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": message,
                  "disable_web_page_preview": "false"
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          def get_state():
              try:
                  result = subprocess.run(
                      [
                          "gh", "variable", "get",
                          "HOTWHEELS_STOCK_STATE",
                          "--repo", REPO
                      ],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode == 0:
                      return result.stdout.strip()

              except Exception:
                  pass

              return "unknown"

          def set_state(state):
              subprocess.run(
                  [
                      "gh", "variable", "set",
                      "HOTWHEELS_STOCK_STATE",
                      "--body", state,
                      "--repo", REPO
                  ],
                  check=False
              )

          print("Setting Blinkit location:", PINCODE)

          # Set Lucknow location
          location = post_api(
              f"{BASE}/set_location",
              {
                  "query": PINCODE,
                  "initiates_session": "true"
              }
          )

          print("Location response:")
          print(json.dumps(location, indent=2))

          if location.get("status") == "error":
              print("Location API error")
              sys.exit(1)

          location_data = location.get("data", {})

          if location_data.get("is_serviceable") is False:
              print("Blinkit is not serviceable for this location.")
              sys.exit(0)

          print("Location is serviceable.")

          print("Checking product:", PRODUCT_ID)

          product = api_request(
              f"{BASE}/get_product_details",
              {
                  "product_id": PRODUCT_ID
              }
          )

          print("Product response:")
          print(json.dumps(product, indent=2))

          if product.get("status") == "error":
              print("Product API returned an error.")
              sys.exit(1)

          data = product.get("data", product)

          # Try several common inventory/availability fields.
          inventory = data.get("inventory")

          available = data.get("available")

          if available is None:
              available = data.get("in_stock")

          if available is None and inventory is not None:
              try:
                  available = int(inventory) > 0
              except Exception:
                  available = False

          if available is None:
              available = False

          try:
              inventory_number = int(inventory)
          except Exception:
              inventory_number = 0

          name = (
              data.get("name")
              or data.get("title")
              or "Hot Wheels product"
          )

          price = data.get("price")

          print("Product:", name)
          print("Price:", price)
          print("Inventory:", inventory)
          print("Available:", available)

          new_state = "in_stock" if available else "out_of_stock"
          old_state = get_state()

          print("Previous state:", old_state)
          print("New state:", new_state)

          # Alert only when product changes from OOS -> IN STOCK.
          if new_state == "in_stock" and old_state != "in_stock":

              message = (
                  "🚨 HOT WHEELS STOCK ALERT! 🚨\n\n"
                  f"🧸 {name}\n"
                  f"🆔 Product ID: {PRODUCT_ID}\n"
                  f"💰 Price: ₹{price if price is not None else 'N/A'}\n"
                  f"📦 Inventory: {inventory_number}\n"
                  f"📍 Lucknow PIN: {PINCODE}\n\n"
                  f"👉 Buy now:\n{PRODUCT_URL}"
              )

              telegram(message)

              print("Telegram stock alert SENT.")

          elif new_state == "in_stock":
              print("Product is still in stock. No duplicate alert.")

          else:
              print("Product is currently out of stock.")

          # Save current state
          set_state(new_state)

          print("Stock check completed successfully.")
          PY
